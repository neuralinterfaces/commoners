name: Comprehensive Test Suite
on:
  schedule:
    - cron: '0 16 * * *' # Daily at noon EST
  push:
    branches: ['main', 'dev']
  pull_request:
  workflow_dispatch:

concurrency: # Cancel previous workflows on the same pull request
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_NUMBER: 2 # increase to reset cache manually

permissions:
  contents: write # Allow publishing releases from this workflow

jobs:
  testing:
    name: Run test suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - run: git fetch --prune --unshallow --tags

      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: commoners-demo
          environment-file: examples/demo/src/services/python/environment.yml
          auto-activate-base: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install FUSE for AppImage support
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fuse

      - name: Install and build dependencies
        run: corepack enable pnpm && pnpm install && pnpm build

      - name: Config and env tests
        run: pnpm test:config && pnpm test:env
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Service compilation tests
        run: pnpm test:services
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.os == 'ubuntu-latest'
        name: E2E start tests (Linux)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm test:start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.os != 'ubuntu-latest'
        name: E2E start tests
        run: pnpm test:start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.os == 'ubuntu-latest'
        name: E2E build tests (Linux)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm test:build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.os != 'ubuntu-latest'
        name: E2E build tests
        run: pnpm test:build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.os == 'ubuntu-latest'
        name: Desktop tests (Linux)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm test:desktop
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.os != 'ubuntu-latest'
        name: Desktop tests
        run: pnpm test:desktop
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
