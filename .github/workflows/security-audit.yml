name: Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informational: the full report, including docs, examples and tooling. Never fails by
      # design (`|| true`); the shipped-package gate is the next step
      - name: Run security audit (informational)
        run: pnpm audit --audit-level=low || true

      # Fails on high or critical advisories in what users install (packages/*); docs,
      # examples and repository tooling are reported as warnings and tracked, not blocking
      - name: Run security audit (fail on high/critical in shipped packages)
        run: node scripts/audit-shipped.mjs

      # Informational: a list of newer versions, not a finding. Never fails by design
      - name: Check for outdated dependencies
        run: pnpm outdated || true

      # Warn-only by policy: every Rust crate in this repository is example code under
      # examples/, which no user installs, so its findings warn (dev/docs dependencies warn,
      # shipped dependencies fail). Make this blocking if a published package ever ships Rust.
      # Crates without a committed Cargo.lock get one generated so they are audited at all.
      - name: Install and run Cargo audit (examples only, warn)
        if: hashFiles('**/Cargo.toml') != ''
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked --quiet
          status=0
          for manifest in $(git ls-files '*Cargo.toml'); do
            dir=$(dirname "$manifest")
            [ -f "$dir/Cargo.lock" ] || cargo generate-lockfile --manifest-path "$manifest"
            echo "::group::cargo audit $dir"
            if ! cargo audit --file "$dir/Cargo.lock"; then
              echo "::warning::cargo audit reported advisories in $dir (example code, not shipped)"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      # Fails when a production dependency of a published package is licensed only under
      # GPL-2.0, GPL-3.0 or AGPL-3.0
      - name: Check for copyleft licenses (shipped packages)
        run: node scripts/license-shipped.mjs
