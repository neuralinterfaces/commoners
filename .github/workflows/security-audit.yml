name: Security Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit (informational)
        run: pnpm audit --audit-level=low || true
        continue-on-error: true

      # Fails on high or critical advisories in what users install (packages/*); docs,
      # examples and repository tooling are reported as warnings and tracked, not blocking
      - name: Run security audit (fail on high/critical in shipped packages)
        run: node scripts/audit-shipped.mjs

      - name: Check for outdated dependencies
        run: pnpm outdated || true
        continue-on-error: true

      - name: Install and run Cargo audit
        if: hashFiles('**/Cargo.toml') != ''
        run: |
          cargo install cargo-audit --quiet
          cargo audit
        continue-on-error: true

      - name: Check for copyleft licenses
        run: npx license-checker --production --failOn 'GPL-2.0;GPL-3.0;AGPL-3.0'
        continue-on-error: true
